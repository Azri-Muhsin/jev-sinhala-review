[project]
name = "jev-sintam-review"
version = "0.1.0"
description = "Jev-Sinhala Quick Capability & Primitive Consistency Probe"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # TypeSafe SDK
    "typesafe-sdk>=0.7.2",
    # Scientific computing
    "pandas>=2.2",
    "numpy>=2.0",
    "scipy>=1.14",
    "scikit-learn>=1.5",
    # Hugging Face datasets
    "datasets>=3.0",
    # Visualization
    "matplotlib>=3.9",
    "seaborn>=0.13",
    # Configuration & utilities
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "python-dotenv>=1.0",
    # Testing
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
